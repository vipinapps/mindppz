<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <title>Admin Login · Research Voices</title>
</head>
<body>
  <div id="top"></div>
  <main class="container">
    <form class="card admin-login" id="form" novalidate>
      <div class="lock" id="lock"></div>
      <h1>Admin panel</h1>
      <p class="muted" style="margin:0 0 20px">Sign in to view survey results.</p>
      <div class="form-field">
        <label for="username">Username</label>
        <input class="input" id="username" name="username" autocomplete="username" required autofocus>
      </div>
      <div class="form-field">
        <label for="password">Password</label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <p class="error-text" id="err" role="alert" style="min-height:21px;margin:4px 0 12px"></p>
      <button class="btn btn-primary" type="submit" id="submit" style="width:100%">Sign in</button>
      <p style="text-align:center;margin:18px 0 0;font-size:14px"><a href="/">← Back to survey</a></p>
    </form>
  </main>
  <script type="module">
    import { topbar, ICONS } from '/js/common.js';
    import { F, services, adminEmail, errorText } from '/js/fb.js';

    document.getElementById('top').innerHTML = topbar('<a class="btn btn-admin" href="/">Survey</a>');
    document.getElementById('lock').innerHTML = ICONS.lock;
    const form = document.getElementById('form');
    const err = document.getElementById('err');
    const btn = document.getElementById('submit');

    async function isAdmin(fb) {
      const u = fb.auth.currentUser;
      if (!u) return false;
      const snap = await F.getDoc(F.doc(fb.db, 'admins', u.uid));
      return snap.exists();
    }

    const fbPromise = services('admin');
    fbPromise.then(async (fb) => {
      if (await isAdmin(fb).catch(() => false)) window.location.replace('/admin');
    }).catch((e) => { err.textContent = errorText(e); });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = '';
      const username = form.username.value.trim();
      const password = form.password.value;
      if (!username || !password) { err.textContent = 'Enter your username and password.'; return; }
      btn.disabled = true; btn.textContent = 'Signing in…';
      try {
        const fb = await fbPromise;
        await F.signInWithEmailAndPassword(fb.auth, adminEmail(username), password);
        if (!(await isAdmin(fb))) {
          await F.signOut(fb.auth);
          throw new Error('This account is not an admin. Add its UID to the “admins” collection in Firestore (see README).');
        }
        window.location.href = '/admin';
      } catch (ex) {
        err.textContent = errorText(ex);
        btn.disabled = false; btn.textContent = 'Sign in';
        form.password.select();
      }
    });
  </script>
</body>
</html>
